<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Память">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0f">
<meta name="application-name" content="Память">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
<title>Память — Cognitive Core</title>
<style>
  /* ── iOS 18 «Сообщения» ─────────────────────────────────────────────── */
  :root{
    --sent:#0a84ff; --recv:#26262b; --recv-t:#fff; --chatbg:#000;
    --ink:#fff; --mut:#8a93a6; --hair:rgba(255,255,255,.08);
    --panel:rgba(20,20,22,.72);
    --поле:rgba(255,255,255,.04);      /* стекло: подложка панелей */
    --кромка:rgba(255,255,255,.10);
    --код-фон:rgba(255,255,255,.07);
    --sysfont:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--chatbg);font-family:var(--sysfont);
    color:var(--ink);-webkit-font-smoothing:antialiased}

  .app{max-width:820px;margin:0 auto;height:100vh;height:100dvh;
    display:flex;flex-direction:column;background:var(--chatbg);overflow:hidden;
    /* ⚠ Цвет текста берём ЗДЕСЬ, а не на body. Светлая тема переопределяет
       --ink на самом .app, а body стоит выше в дереве и остаётся с тёмным
       набором — потомки наследовали от него белый. Итог: в светлой теме имена
       отправителей и заголовок шапки были белым по белому, контраст 1.0
       (замер 06.09). Дефект жил давно и виден только при переключении темы. */
    color:var(--ink)}

  /* Экраны-вкладки */
  .view{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
  .view.active{display:flex}

  /* Хедеры */
  .vhead{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 9px;
    background:var(--panel);backdrop-filter:saturate(180%) blur(22px);
    -webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--hair)}
  .vhead>b{font-size:19px;font-weight:700}
  .chat-head .back{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;
    justify-content:center;font-size:28px;line-height:1;background:none;border:none;
    color:var(--sent);cursor:pointer;padding:0}
  .chat-head .peer{flex:1;min-width:0;display:flex;align-items:center;gap:9px;justify-content:center}
  .chat-head .ava{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#5e5ce6,#0a84ff)}
  .chat-head .ttl{min-width:0;text-align:center}
  .chat-head .ttl b{display:block;font-size:16px;line-height:1.1;font-weight:600}
  .chat-head .ttl small{font-size:11.5px;color:#30d158}
  .chat-head .ttl small::before{content:'●';font-size:8px;margin-right:3px;vertical-align:1px}
  .hspace{flex:0 0 auto;width:34px}

  /* ── Лента чата ── */
  #log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;
    display:flex;flex-direction:column;gap:2px}
  /* Имя отправителя: цветом, а не прозрачностью. Полупрозрачный белый на
     светлой теме давал контраст 1.9 при норме 4.5 — подпись «Память» под
     сообщением приходилось угадывать (замер 06.09). */
  .who{font-size:11px;color:var(--mut);margin:12px 0 3px 14px;font-weight:500}
  .row{display:flex;margin:1px 0}
  .row.me{justify-content:flex-end}
  .bubble{position:relative;max-width:75%;padding:8px 14px;font-size:16px;line-height:1.35;
    white-space:pre-wrap;word-wrap:break-word;border-radius:19px;
    animation:pop .22s cubic-bezier(.2,.9,.3,1.3)}
  .them .bubble{background:var(--recv);color:var(--recv-t)}
  .me .bubble{background:var(--sent);color:#fff}
  .them .bubble::before{content:'';position:absolute;bottom:0;left:-7px;width:14px;height:19px;
    background:var(--recv);border-bottom-right-radius:16px}
  .them .bubble::after{content:'';position:absolute;bottom:0;left:-11px;width:11px;height:19px;
    background:var(--chatbg);border-bottom-right-radius:12px}
  .me .bubble::before{content:'';position:absolute;bottom:0;right:-7px;width:14px;height:19px;
    background:var(--sent);border-bottom-left-radius:16px}
  .me .bubble::after{content:'';position:absolute;bottom:0;right:-11px;width:11px;height:19px;
    background:var(--chatbg);border-bottom-left-radius:12px}
  .row.grp .bubble::before,.row.grp .bubble::after{display:none}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .typing .bubble{padding:12px 15px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#8e8e93;display:block;animation:tp 1.3s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes tp{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .media-link{color:inherit;text-decoration:underline;font-weight:600;opacity:.95}
  .media-img{max-width:222px;max-height:290px;border-radius:14px;display:block;margin:2px 0;cursor:pointer;background:rgba(0,0,0,.15)}
  .daysep{align-self:center;font-size:11px;color:var(--mut);margin:15px 0 7px;font-weight:600}
  .empty{margin:auto;opacity:.45;font-size:14px;text-align:center;padding:0 24px}

  /* Композер */
  .composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 10px;
    background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-top:.5px solid var(--hair)}
  .icon-btn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:none;background:transparent;
    color:var(--sent);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .icon-btn.recording{color:#ff453a;animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  #micTimer{font-size:11px;margin-left:1px;color:#ff453a}
  #box{flex:1;resize:none;min-height:36px;max-height:120px;border-radius:18px;padding:8px 14px;
    font-size:16px;font-family:inherit;line-height:1.3;background:rgba(255,255,255,.08);
    color:var(--ink);border:.5px solid var(--hair);outline:none}
  #box::placeholder{color:#8e8e93}
  #send{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:none;background:var(--sent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;transition:transform .12s,opacity .12s;
    display:flex;align-items:center;justify-content:center}
  #send:disabled{opacity:0;transform:scale(.5);pointer-events:none;width:0;margin:0}

  /* ── Комнаты ── */
  .rlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .rrow{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;
    border-bottom:.5px solid var(--hair)}
  .rrow:active{background:rgba(255,255,255,.06)}
  .rav{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#5e5ce6,#0a84ff)}
  .rmain{flex:1;min-width:0}
  .rname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmain>.rtop{display:flex;align-items:baseline;gap:8px}
  .rname{flex:1;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtime{flex:0 0 auto;font-size:12px;color:var(--mut)}
  .rlast{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .rrow.locked{opacity:.5}
  .rarr{flex:0 0 auto;color:var(--mut);font-size:20px}
  .media-audio{display:block;width:100%;max-width:280px;height:36px;margin:2px 0}
  .media-tr{font-size:13px;color:var(--mut);margin-top:4px;font-style:italic}
  .rdot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#0a84ff;align-self:center}
  .rrow.unread .rname{font-weight:650}
  .rrow.unread .rlast{color:var(--fg)}

  /* ── Профиль ── */
  .pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px}
  .pcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;
    background:rgba(255,255,255,.05);margin-bottom:20px}
  .pav{width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:22px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#5e5ce6,#0a84ff)}
  .pname{font-size:19px;font-weight:700}
  .pmeta{font-size:13.5px;color:var(--mut);margin-top:3px}
  .pgrp{border-radius:14px;overflow:hidden;background:rgba(255,255,255,.05);margin-bottom:18px}
  .prow{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:.5px solid var(--hair);
    font-size:15.5px}
  .prow:last-child{border-bottom:none}
  .prow.btn{cursor:pointer}.prow.btn:active{background:rgba(255,255,255,.06)}
  .prow .pl{flex:1;display:flex;align-items:center;gap:11px}
  .prow .pic{width:22px;text-align:center}
  .prow .pval{color:var(--mut);font-size:14px}
  .prow .parr{color:var(--mut);font-size:18px}
  .prow.danger{color:#ff453a}
  .toggle{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;
    cursor:pointer;transition:background .2s;flex:0 0 auto}
  .toggle:after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:transform .2s}
  .toggle.on{background:#30d158}.toggle.on:after{transform:translateX(18px)}

  /* ── Таб-бар ── */
  .tabbar{flex:0 0 auto;display:flex;background:rgba(18,18,20,.92);
    backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab{flex:1;text-align:center;padding:8px 0 5px;font-size:22px;color:var(--mut);
    background:none;border:none;cursor:pointer;font-family:inherit}
  .tab span{display:block;font-size:10px;margin-top:1px}
  .tab.active{color:var(--sent)}
  .tab .badge{display:none}

  /* ── Светлая тема ── */
  .app.light{--chatbg:#fff;--recv:#e5e5ea;--recv-t:#000;--ink:#000;--mut:#6b7280;
    --panel:rgba(245,245,247,.86);--hair:rgba(0,0,0,.08);
    /* 06.09: те же три величины для светлой темы — подложка панелей, кромка и
       фон кусков кода. Без них разметка в пузырях на светлом фоне теряется:
       код сливается с сообщением, а вторая панель — с лентой. */
    --поле:rgba(0,0,0,.035);--кромка:rgba(0,0,0,.09);--код-фон:rgba(0,0,0,.06)}
  .app.light .tabbar{background:rgba(245,245,247,.92)}
  .app.light #box{background:rgba(0,0,0,.05)}
  .app.light .pcard,.app.light .pgrp{background:rgba(0,0,0,.05)}
  .app.light .rrow:active,.app.light .prow.btn:active{background:rgba(0,0,0,.05)}
  /* Кнопки в шапках (＋ создать, ⋯ настройки) */
  .hbtn{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-size:23px;background:none;border:none;color:var(--sent);cursor:pointer;padding:0}
  .vhead .spring{flex:1}

  /* ── Шит (настройки комнаты / добавить агента) ── */
  .sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
  .sheet.open{display:flex}
  .sheet-card{width:100%;max-width:820px;background:#1c1c1e;border-radius:18px 18px 0 0;
    padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:88vh;overflow-y:auto;
    animation:slideup .25s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .app.light .sheet-card{background:#f2f2f7}
  .sheet-card h3{margin:0 0 12px;font-size:19px}
  .srow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:.5px solid var(--hair)}
  .srow:last-of-type{border-bottom:none}
  .srow .sn{flex:1;min-width:0}
  .srow .snm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .ss{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-btn{display:block;width:100%;padding:12px;border-radius:12px;border:none;font-size:15px;
    font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;background:rgba(255,255,255,.1);color:var(--ink)}
  .app.light .sheet-btn{background:rgba(0,0,0,.06)}
  .sheet-btn.primary{background:var(--sent);color:#fff}
  .sheet-btn.danger{background:rgba(255,69,58,.15);color:#ff453a}

  /* ── Разметка внутри пузыря ──────────────────────────────────────────
     Отчёты агентов — это заголовки, списки и куски кода. Раньше всё это
     приходило звёздочками и дефисами прямо в текст; теперь разбирается, но
     должно и выглядеть спокойно: пузырь остаётся сообщением, а не страницей
     документации. Отсюда сдержанные размеры и никаких рамок вокруг всего. */
  .bubble .заголовок{font-weight:700;margin:10px 0 4px;line-height:1.25}
  .bubble .заголовок:first-child{margin-top:0}
  .bubble .у1{font-size:17px}
  .bubble .у2{font-size:16px}
  .bubble .у3,.bubble .у4{font-size:15px;opacity:.9}
  .bubble .список{margin:5px 0;padding-left:20px}
  .bubble .список li{margin:2px 0}
  .bubble .черта{border:none;border-top:1px solid var(--кромка);margin:10px 0}
  .bubble .встроенный{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.88em;background:var(--код-фон);padding:1px 5px;border-radius:5px}
  .bubble .код{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--код-фон);
    overflow-x:auto;font-size:12.5px;line-height:1.45;white-space:pre}
  .bubble .код code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .bubble .ссылка{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .me .bubble .встроенный,.me .bubble .код{background:rgba(255,255,255,.16)}

  /* Длинный отчёт складываем: агент может прислать три экрана разбора, и
     переписка после этого не листается. Показываем начало и кнопку. */
  .bubble.свёрнут{max-height:290px;overflow:hidden;position:relative}
  .bubble.свёрнут::after{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;
    background:linear-gradient(180deg,transparent,var(--recv))}
  .me .bubble.свёрнут::after{background:linear-gradient(180deg,transparent,var(--sent))}
  .развернуть{display:inline-block;margin:4px 0 2px;padding:5px 12px;border-radius:14px;
    border:1px solid var(--кромка);background:var(--поле);color:var(--ink);
    font:inherit;font-size:12.5px;cursor:pointer}
  .развернуть:hover{background:var(--код-фон)}

  /* Кто ответил вместо агента: заместитель отвечает от своего имени, и это
     должно быть видно сразу — иначе кажется, что писал сам агент. */
  .чип-зам{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;
    font-size:10.5px;font-weight:600;letter-spacing:.2px;
    background:var(--код-фон);color:var(--mut);vertical-align:1px}

  /* ── Ноутбук и монитор: две панели вместо телефонной колонки ───────────
     Владелец 06.09: «дизайн так себе, чат не удобный». На экране 1920 приложение
     оставалось узкой телефонной полосой шириной 820 посреди чёрного поля, а
     переход между комнатами и перепиской шёл через нижние вкладки — как на
     телефоне, хотя места хватает на обе панели сразу.

     От 900 точек: слева список комнат, справа переписка. Вкладки прячем — они
     телефонная вещь, на ноутбуке их место занимает сама раскладка. Ширину
     держим 1440: это MacBook 13 целиком и MacBook 15 с ровными полями. */
  @media (min-width: 900px){
    .app{max-width:1440px;display:grid;grid-template-columns:320px 1fr;
      grid-template-rows:100%;height:100vh;height:100dvh;
      border-left:1px solid var(--кромка);border-right:1px solid var(--кромка)}
    .app > .view{display:flex!important}
    #vRooms{grid-column:1;border-right:1px solid var(--кромка);background:var(--поле)}
    #vChat{grid-column:2;min-width:0}
    /* Профиль на широком экране — накладкой поверх переписки, а не третьей
       вкладкой: заходят туда редко, а место отнимал бы постоянно. */
    #vProfile{position:fixed;inset:0;z-index:60;max-width:520px;margin:auto;height:auto;
      max-height:82vh;border-radius:18px;border:1px solid var(--кромка);
      background:var(--panel);backdrop-filter:saturate(180%) blur(22px);
      -webkit-backdrop-filter:saturate(180%) blur(22px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
    #vProfile:not(.active){display:none!important}
    .tabbar{display:none}
    .chat-head .back{display:none}          /* назад некуда — список всегда виден */
    /* Отчёты агентов длинные: на широкой панели пузырь может позволить себе
       больше, иначе текст ползёт узкой лентой посреди пустоты. */
    .bubble{max-width:min(720px,82%)}
    #log{padding:16px 20px 10px}
    .composer{padding:10px 16px 14px}
  }
  @media (min-width: 1280px){
    .app{grid-template-columns:340px 1fr}
  }

  /* Убираем плавающий ассистент-виджет — приложение само по себе чат */
  #cogasst-fab,#cogasst-panel{display:none!important}
</style>
</head>
<body>
<!-- self-contained app: подавляем серверную инъекцию плавающих виджетов: assistant-widget.js + topbar-chat -->
<div class="app" id="app">

  <!-- ЧАТ -->
  <section class="view chat-head-view active" id="vChat">
    <header class="vhead chat-head">
      <button class="back" id="toRooms" title="К комнатам">‹</button>
      <div class="peer">
        <div class="ava" id="chatAva">🧠</div>
        <div class="ttl"><b id="chatName">Чат</b><small id="chatStatus">агенты на связи</small></div>
      </div>
      <button class="hbtn" id="roomInfo" title="Настройки комнаты" type="button">⋯</button>
    </header>
    <div id="log"><div class="empty">Загрузка…</div></div>
    <div class="composer">
      <input type="file" id="filePicker" hidden>
      <button id="fileBtn" class="icon-btn" title="Прикрепить файл">📎</button>
      <button id="micBtn" class="icon-btn" title="Записать голос">🎤<span id="micTimer"></span></button>
      <textarea id="box" rows="1" placeholder="Сообщение… (@Память чтобы адресовать)" enterkeyhint="send"></textarea>
      <button id="send" disabled title="Отправить">↑</button>
    </div>
  </section>

  <!-- КОМНАТЫ -->
  <section class="view" id="vRooms">
    <header class="vhead"><b>Комнаты</b><span class="spring"></span>
      <button class="hbtn" id="newRoom" title="Новая комната" type="button">＋</button></header>
    <div class="rlist" id="rlist"><div class="empty">Загрузка…</div></div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="view" id="vProfile">

<!-- Шит: настройки комнаты / добавить агента -->
<div class="sheet" id="sheet"><div class="sheet-card" id="sheetCard"></div></div>

<script>
const app = document.getElementById('app');
const log = document.getElementById('log');
const box = document.getElementById('box');
const send = document.getElementById('send');
let roomId = null, rooms = [], supportRoomId = null, roomKey = null, liveGen = 0;
const seen = new Set();
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const J = {credentials:'include'};
const H = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isMe = a => (a||'').startsWith('owner');
const initials = s => (s||'?').trim().replace(/^[@#]/,'').slice(0,2).toUpperCase();
const AVAP=['#5e5ce6,#0a84ff','#ff375f,#ff9f0a','#30d158,#0a84ff','#bf5af2,#5e5ce6','#ff9f0a,#ff375f','#64d2ff,#5e5ce6'];
function colorFor(s){ let h=0; for(const c of (s||'x')) h=(h*31+c.charCodeAt(0))>>>0; return AVAP[h%AVAP.length]; }
// Текст сообщения: убираем служебный @dsdsd, а маркеры вложений (📎 name (media:id))
// превращаем в плейсхолдер, который асинхронно гидратируется в картинку/транскрипт/ссылку.
function renderText(s){
  let t = H((s||'').replace(/\s*@dsdsd\b/gi,''));
  t = t.replace(/(?:📎|🎤|📷)?\s*([^\n(]*?)\s*\(media:([a-f0-9-]{6,})\)/g, (m, fname, id)=>
    `<span class="media" data-media="${id}" data-name="${H((fname||'').trim())}">📎 ${H((fname||'').trim()||'файл')}</span>`);
  return разметка(t);
}

// Разметка в сообщениях агентов.
//
// Владелец 06.09: «чат не удобный» — агенты пишут отчёты обычной разметкой, а
// чат показывал её как есть: строки в звёздочках, дефисы вместо списков,
// «---» поперёк текста. Читать такое невозможно, а писать иначе агенты не
// станут: разметка — их обычный способ отвечать.
//
// ⚠ Разбираем ПОСЛЕ экранирования (H выше): на вход приходит уже безопасный
// текст, поэтому мы только добавляем свои теги и никогда не пропускаем чужие.
// Внешних библиотек нет намеренно — страница ходит под строгой политикой
// источников, чужой адрес подключать нельзя.
function разметка(t){
  const блоки = [];
  // Метка-заглушка для кусков кода. Нулевой символ в сообщении не встречается,
  // а вот «пробел-число-пробел» встречается сплошь и рядом: на такой заглушке
  // безобидное «в 3 часа» превратилось бы в кусок чужого кода.
  const МЕТКА = String.fromCharCode(0);
  // Куски кода вынимаем первыми, чтобы внутри них ничего не толковалось.
  t = t.replace(/```([^\n]*)\n?([\s\S]*?)```/g, function(m, язык, тело){
    блоки.push('<pre class="код"><code>' + тело.replace(/\n$/, '') + '</code></pre>');
    return МЕТКА + (блоки.length - 1) + МЕТКА;
  });
  t = t.replace(/`([^`\n]+)`/g, '<code class="встроенный">$1</code>');

  const строки = t.split('\n');
  const итог = [];
  let список = null;                       // какой список сейчас открыт
  const закрыть = function(){ if (список) { итог.push('</' + список + '>'); список = null; } };

  for (const исходная of строки){
    const s = исходная.replace(/\s+$/, '');
    let m;
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s)) { закрыть(); итог.push('<hr class="черта">'); continue; }
    if ((m = /^(#{1,4})\s+(.*)$/.exec(s))) {
      закрыть();
      итог.push('<div class="заголовок у' + Math.min(m[1].length, 4) + '">' + m[2] + '</div>');
      continue;
    }
    if ((m = /^\s*[-*•]\s+(.*)$/.exec(s))) {
      if (список !== 'ul') { закрыть(); итог.push('<ul class="список">'); список = 'ul'; }
      итог.push('<li>' + m[1] + '</li>');
      continue;
    }
    if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(s))) {
      if (список !== 'ol') { закрыть(); итог.push('<ol class="список">'); список = 'ol'; }
      итог.push('<li>' + m[1] + '</li>');
      continue;
    }
    закрыть();
    итог.push(s);
  }
  закрыть();
  t = итог.join('\n');
  // Пузырь показывает текст «как есть» (white-space: pre-wrap), поэтому
  // переносы, оставшиеся ВОКРУГ блочных тегов, превращаются в пустые строки:
  // список разъезжается, между пунктами дыры в строку (видно на снимке 393).
  // Убираем именно их — переносы внутри обычного текста трогать нельзя, на
  // них держится абзац.
  t = t
    .replace(/\n*(<(?:ul|ol|hr|pre|div)[^>]*>)\n*/g, '$1')
    .replace(/\n*(<\/(?:ul|ol|pre|div)>)\n*/g, '$1')
    .replace(/\n*(<li>)/g, '$1')
    .replace(/(<\/li>)\n*/g, '$1');

  // Выделения — после разбора строк, чтобы звёздочка списка не путалась с курсивом.
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)!?]|$)/g, '$1<i>$2</i>');
  // Ссылки: только http(s). Иначе в текст можно подсунуть javascript: и прочее.
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a class="ссылка" href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  return t.replace(new RegExp(МЕТКА + '(\\d+)' + МЕТКА, 'g'), function(m, i){ return блоки[+i]; });
}

// Асинхронная гидратация вложения: картинка инлайн, голос → транскрипт, прочее → ссылка.
async function hydrateMedia(span){
  if(span.dataset.h) return; span.dataset.h='1';
  const id=span.dataset.media, name=span.dataset.name||'';
  try{
    const info=await (await fetch('/api/media/info/'+id)).json();
    if(info.kind==='image' && info.url){
      span.innerHTML='<img class="media-img" loading="lazy" alt="'+H(name)+'">';
      const img=span.querySelector('img'); img.src=info.url;
      img.addEventListener('click',()=>window.open(info.url,'_blank','noopener'));
    } else if(info.kind==='audio' && info.url){
      // Сам звук, а не только его расшифровка: Whisper молча теряет имена,
      // цифры и интонацию, и проверить его было нечем.
      span.innerHTML='<audio class="media-audio" controls preload="none"></audio>'+
        (info.transcript?'<div class="media-tr">'+H(info.transcript)+'</div>':'');
      span.querySelector('audio').src=info.url;
    } else if(info.transcript){
      span.textContent='🎤 «'+info.transcript+'»';
    } else {
      span.innerHTML='<a class="media-link" href="'+(info.url||('/api/media/info/'+id))+'" target="_blank" rel="noopener">📎 '+H(name||info.filename||'файл')+' ↗</a>';
    }
  }catch(e){}
}
// Метка времени над сообщением (день сменился ИЛИ пауза > 15 мин).
let lastTs=null;
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function fmtSep(d){
  const now=new Date(), hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(sameDay(d,now)) return 'Сегодня '+hm;
  if(sameDay(d,y)) return 'Вчера '+hm;
  return d.getDate()+' '+MON[d.getMonth()]+' '+hm;
}
function fmtShort(iso){
  if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  const now=new Date(), sameDay=d.toDateString()===now.toDateString();
  if(sameDay) return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'вчера';
  return d.getDate()+' '+MON[d.getMonth()];
}

/* ─── Навигация по вкладкам ─── */
const views = ['vChat','vRooms','vProfile'];
function go(id){
  views.forEach(v=>document.getElementById(v).classList.toggle('active', v===id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.getAttribute('data-v')===id));
  if(id==='vChat' && roomId) log.scrollTop=log.scrollHeight;
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>go(t.getAttribute('data-v'))));
document.getElementById('toRooms').addEventListener('click',()=>go('vRooms'));

/* ─── Комнаты ─── */
async function loadRooms(){
  try{
    const r = await fetch('/user/rooms', J);
    if(r.status===401){ location.href='/ui/login?return=/chat'; return; }
    const d = await r.json();
    rooms = (d.items||[]).filter(x=>x.is_owner!==false);
    // Комната техподдержки — служебная, прячем её из списка «Комнаты».
    const sr=rooms.find(x=>(x.name||'').indexOf('🛟')===0 || x.name==='Техподдержка');
    supportRoomId = sr ? sr.id : null;
    renderRoomList();
    await autoOpen();
  }catch(e){ document.getElementById('rlist').innerHTML='<div class="empty">Ошибка загрузки комнат</div>'; }
}
// Обычные комнаты (без служебной техподдержки).
function realRooms(){ return rooms.filter(x=> x.id!==supportRoomId && (x.name||'').indexOf('🛟')!==0 && x.name!=='Техподдержка'); }
// Прочитанность держим на устройстве: серверная потребовала бы таблицы
// «кто что видел», а ради точки в списке миграция не окупается. Цена честная —
// метка не переезжает между устройствами.
function seenKey(id){ return 'cc_seen_'+id; }
function markSeen(id, iso){ try{ localStorage.setItem(seenKey(id), iso||new Date().toISOString()); }catch(e){} }
function isUnread(x){
  const lm=x.last_message; if(!lm || isMe(lm.from_agent)) return false;
  let seenIso=null; try{ seenIso=localStorage.getItem(seenKey(x.id)); }catch(e){}
  if(!seenIso) return true;
  return Date.parse(lm.created_at) > Date.parse(seenIso);
}
// Чистка текста для строки списка: медиа-маркеры и скрытая @-адресация
// в превью выглядят мусором.
function previewOf(lm){
  const txt=(lm.text||'')
    .replace(/\s*@dsdsd\b/gi,'')
    .replace(/\(media:[a-f0-9-]{6,}\)/g,'📷')
    .replace(/[📎🎤📷]\s*[^\n]*\.(png|jpe?g|webp|gif|pdf|webm)/gi,'📷 вложение')
    .replace(/\n+/g,' ').trim();
  return (isMe(lm.from_agent)?'Вы: ':'')+(txt||'вложение');
}
function renderRoomList(){
  const el = document.getElementById('rlist');
  const list = realRooms();
  if(!list.length){ el.innerHTML='<div class="empty">У тебя пока нет своих комнат.</div>'; return; }
  // Превью приходит вместе со списком (last_message). Раньше здесь стояла
  // догрузка /detail по каждой комнате — N запросов ради одной строки текста,
  // и ещё N в autoOpen на поиск доступной. Открытие /chat стоило до 2N.
  el.innerHTML = list.map(x=>{
    const lm=x.last_message, nw=isUnread(x);
    return `<div class="rrow${nw?' unread':''}" data-id="${x.id}" data-name="${H(x.name)}">
       <div class="rav" style="background:linear-gradient(135deg,${colorFor(x.name)})">${H(initials(x.name))}</div>
       <div class="rmain">
         <div class="rtop"><span class="rname">${H(x.name)}</span><span class="rtime">${lm?H(fmtShort(lm.created_at)):''}</span></div>
         <div class="rlast">${lm?H(previewOf(lm)):'Пока пусто'}</div>
       </div>
       <span class="${nw?'rdot':'rarr'}">${nw?'':'›'}</span>
     </div>`;}).join('');
  el.querySelectorAll('.rrow').forEach(row=>row.addEventListener('click',()=>{
    openRoom(row.getAttribute('data-id'), row.getAttribute('data-name'));
  }));
}
// Открыть первую комнату. Проба запросом больше не нужна: список уже
// отфильтрован по is_owner, а /detail требует ровно владения — 403 здесь
// взяться неоткуда.
async function autoOpen(){
  const first = realRooms()[0];
  if(!first){
    roomId=null;
    log.innerHTML='<div class="empty">Нет доступных комнат для чтения. Открой свою в «Комнатах».</div>';
    return;
  }
  setRoom(first.id, first.name); roomKey=null;
  await refresh(true); startLive();
}
function setRoom(id,name){
  roomId=id;
  document.getElementById('chatName').textContent=name||'Чат';
  document.getElementById('chatAva').textContent=initials(name);
  document.getElementById('chatStatus').textContent='агенты на связи';
  const ri=document.getElementById('roomInfo'); if(ri) ri.style.display='';
}
async function openRoom(id,name){
  setRoom(id,name); go('vChat'); seen.clear(); roomKey=null; log.innerHTML='<div class="empty">Загрузка…</div>';
  markSeen(id);
  await refresh(true); startLive();
}

/* ─── Рендер сообщений ─── */
function lastRow(){ let n=log.lastElementChild; while(n && !n.classList.contains('row')) n=n.previousElementSibling; return n; }
function render(m){
  if(seen.has(m.id)) return false;
  seen.add(m.id); hideTyping();
  const ts=m.created_at?new Date(m.created_at):null;
  if(ts && !isNaN(ts)){
    if(!lastTs || (ts-lastTs)>15*60000 || ts.toDateString()!==lastTs.toDateString()){
      const sep=document.createElement('div'); sep.className='daysep'; sep.textContent=fmtSep(ts); log.appendChild(sep);
    }
    lastTs=ts;
  }
  const mine=isMe(m.from_agent);
  const prev=lastRow();
  const sameSender = prev && prev.dataset.who===m.from_agent;
  if(!mine && !sameSender){
    const w=document.createElement('div'); w.className='who';
    w.textContent=m.display_name||m.from_agent;
    // Ответил заместитель — говорим об этом сразу. Иначе кажется, что писал
    // сам агент, и человек ждёт от ответа большего, чем тот может дать.
    if(m.origin==='standin'){
      const чип=document.createElement('span');
      чип.className='чип-зам'; чип.textContent='заместитель';
      w.appendChild(чип);
    }
    log.appendChild(w);
  }
  const row=document.createElement('div');
  row.className='row '+(mine?'me':'them')+(sameSender?' grp':''); row.dataset.who=m.from_agent;
  row.innerHTML='<div class="bubble">'+renderText(m.text)+'</div>';
  log.appendChild(row);
  свернутьДлинное(row, m.text);
  row.querySelectorAll('.media[data-media]').forEach(hydrateMedia);
  return true;
}
// Длинный отчёт складываем до кнопки: агент присылает разбор на три экрана,
// и переписка после такого не листается вовсе. Порог 1200 знаков — примерно
// полтора экрана телефона; короткие ответы не трогаем.
const ПОРОГ_СВЁРТКИ = 1200;
function свернутьДлинное(row, текст){
  if((текст||'').length <= ПОРОГ_СВЁРТКИ) return;
  const пузырь = row.querySelector('.bubble');
  if(!пузырь) return;
  пузырь.classList.add('свёрнут');
  // Кнопка идёт ОТДЕЛЬНОЙ строкой под пузырём, а не внутри него: строка
  // сообщения — это flex-ряд, и кнопка в нём встаёт сбоку, посреди пустоты
  // (проверено глазами на 1920). Выравниваем по той же стороне, что и само
  // сообщение, — иначе она отрывается от своего пузыря.
  const строка = document.createElement('div');
  строка.className = 'row ' + (row.classList.contains('me') ? 'me' : 'them');
  const кнопка = document.createElement('button');
  кнопка.type='button'; кнопка.className='развернуть'; кнопка.textContent='Показать полностью';
  кнопка.addEventListener('click', ()=>{
    пузырь.classList.remove('свёрнут');
    строка.remove();
  });
  строка.appendChild(кнопка);
  row.after(строка);
}

function paint(d, reset){
  if(d && d.api_key) roomKey=d.api_key;   // ключ комнаты для live-подписки
  const msgs=(d&&d.messages)||[];
  if(reset){ log.innerHTML=''; seen.clear(); lastTs=null; }
  let added=false; msgs.forEach(m=>{ if(render(m)) added=true; });
  if(!log.children.length) log.innerHTML='<div class="empty">Пока пусто — напиши первым</div>';
  if(added||reset) log.scrollTop=log.scrollHeight;
  // Прочитано = показано. Ставим здесь, а не в openRoom: пока комната
  // открыта, приходящие сообщения тоже прочитаны.
  if(roomId && (added||reset)) markSeen(roomId);
}
let typingEl=null, typingTmr=null;
function showTyping(){
  hideTyping();
  typingEl=document.createElement('div'); typingEl.className='row them typing';
  typingEl.innerHTML='<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
  log.appendChild(typingEl); log.scrollTop=log.scrollHeight;
  typingTmr=setTimeout(hideTyping,30000);
}
function hideTyping(){ if(typingEl){ typingEl.remove(); typingEl=null; } if(typingTmr){ clearTimeout(typingTmr); typingTmr=null; } }

async function refresh(reset){
  if(!roomId) return;
  try{
    const r=await fetch(`/user/rooms/${roomId}/detail`, J);
    if(!r.ok){ if(reset) log.innerHTML='<div class="empty">'+
      (r.status===403?'Это чужая комната — доступна только владельцу. Выбери свою в «Комнатах».'
                     :'Не удалось загрузить ('+r.status+')')+'</div>'; return; }
    paint(await r.json(), reset);
  }catch(e){}
}
// Live-подписка: long-poll /rooms/{id}/wait (PG NOTIFY, sub-second). При ошибке — откат на 4с-poll.
async function startLive(){
  const gen = ++liveGen;                    // отменяет прежний цикл при смене комнаты
  const myRoom = roomId;
  while(gen===liveGen && roomId===myRoom && roomId){
    const t0=Date.now(); let ok=false;
    try{
      const r = await fetch(`/rooms/${myRoom}/wait?since_seconds=5&timeout=25`,
        {credentials:'include', headers: roomKey?{'X-Room-Key':roomKey}:{}});
      ok = r.ok;
      if(gen!==liveGen || roomId!==myRoom) return;
      if(r.ok) await refresh(false);
    }catch(e){ ok=false; }
    if(gen!==liveGen || roomId!==myRoom) return;
    if(!ok){ await refresh(false); await sleep(4000); }        // fallback poll
    else if(Date.now()-t0 < 500) await sleep(500);             // антидребезг busy-loop
  }
}
async function submit(){
  const t=box.value.trim(); if(!t||!roomId) return;
  box.value=''; autosize(); send.disabled=true;
  // В ветке техподдержки добавляем скрытый @dsdsd — сообщение уходит мне в inbox с уведомлением.
  const out = (roomId===supportRoomId) ? (t+' @dsdsd') : t;
  try{ await fetch(`/user/rooms/${roomId}/post`,{...J,method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({text:out})}); }catch(e){}
  await refresh(false); showTyping(); setTimeout(()=>refresh(false),800);
}

/* ─── Прикрепления ─── */
const fileBtn=document.getElementById('fileBtn'), filePicker=document.getElementById('filePicker');
const micBtn=document.getElementById('micBtn'), micTimer=document.getElementById('micTimer');
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(file); }); }
async function uploadAndInsert(file, emoji){
  send.disabled=true; const ph=box.placeholder; box.placeholder='Загрузка…';
  try{
    const b64=await fileToB64(file);
    const r=await fetch('/api/media/upload_b64',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({file_b64:b64, filename:file.name, kind:'auto'})});
    if(!r.ok){ let d=r.status; try{ d=(await r.json()).detail||d; }catch(e){} alert('Не удалось загрузить: '+d); return; }
    const mid=(await r.json()).media_id||'?';
    box.value=(box.value?box.value.replace(/\n?$/,'\n'):'')+`${emoji} ${file.name} (media:${mid})`+'\n';
    box.dispatchEvent(new Event('input',{bubbles:true})); box.focus();
  }catch(e){ alert('Ошибка: '+(e&&e.message||e)); }
  finally{ box.placeholder=ph; send.disabled=!box.value.trim(); }
}
fileBtn.addEventListener('click',()=>filePicker.click());
filePicker.addEventListener('change',async e=>{ const f=(e.target.files||[])[0]; if(f) await uploadAndInsert(f,'📎'); filePicker.value=''; });

let rec=null, chunks=[], stream=null, t0=0, tick=null;
micBtn.addEventListener('click',async ()=>{
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Запись не поддерживается'); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(err){ alert('Микрофон отклонён: '+(err&&err.message||err)); return; }
  try{ rec=new MediaRecorder(stream,{mimeType:'audio/webm;codecs=opus'}); }catch(e){ rec=new MediaRecorder(stream); }
  chunks=[];
  rec.ondataavailable=ev=>{ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  rec.onstop=async ()=>{
    micBtn.classList.remove('recording'); micTimer.textContent='';
    if(tick){ clearInterval(tick); tick=null; }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(!chunks.length) return;
    const blob=new Blob(chunks,{type:'audio/webm'});
    const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    await uploadAndInsert(new File([blob],`voice_${stamp}.webm`,{type:'audio/webm'}),'🎤');
    rec=null; chunks=[];
  };
  rec.start(); micBtn.classList.add('recording'); t0=Date.now(); micTimer.textContent='0:00';
  tick=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000);
    micTimer.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); if(s>=300) rec.stop(); },250);
});

let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; buildProfile(lastUser); });
let lastUser=null, appVer='';
function themeOn(){ return localStorage.getItem('chat-theme')==='light'; }
function applyTheme(){ app.classList.toggle('light', themeOn()); }
async function loadProfile(){
  try{ const h=await (await fetch('/health',J)).json(); appVer=h.version||''; }catch(e){}
  try{
    const r=await fetch('/user/me', J);
    if(r.status===401){ location.href='/ui/login?return=/chat'; return; }
    lastUser=await r.json();
  }catch(e){ lastUser=null; }
  buildProfile(lastUser);
}
function buildProfile(u){
  const body=document.getElementById('pbody');
  const name=(u&&(u.display_name||u.email))||'Гость';
  const email=(u&&u.email)||'';
  const role=u? (u.is_admin?'Админ':'Владелец') : '';
  const installRow = isStandalone ? '' :
    `<div class="prow btn" id="rInstall"><div class="pl"><span class="pic">📲</span>Установить приложение</div><span class="parr">›</span></div>`;
  body.innerHTML =
    `<div class="pcard">
       <div class="pav">${H(initials(name))}</div>
       <div><div class="pname">${H(name)}</div><div class="pmeta">${H(email)}${role?' · '+role:''}</div></div>
     </div>
     <div class="pgrp">
       <div class="prow btn" id="rEditName"><div class="pl"><span class="pic">✏️</span>Изменить имя</div><span class="parr">›</span></div>
       <div class="prow"><div class="pl"><span class="pic">🌙</span>Тёмная тема</div>
         <div class="toggle ${themeOn()?'':'on'}" id="rTheme"></div></div>
       ${installRow}
       <div class="prow"><div class="pl"><span class="pic">🔔</span>Уведомления</div>
         <div class="toggle" id="rPush"></div></div>
       <div class="prow"><div class="pl"><span class="pic">🔄</span>Версия</div>
         <span class="pval">${appVer?('v'+H(appVer)):'Cognitive Core'}</span></div>
     </div>
     <div class="pgrp">
       <div class="prow btn" id="rSupport"><div class="pl"><span class="pic">🛟</span>Техподдержка</div><span class="parr">›</span></div>
     </div>
     <div class="pgrp">
       <div class="prow btn" id="rSwitch"><div class="pl"><span class="pic">🔀</span>Войти под другим</div><span class="parr">›</span></div>
       <div class="prow btn danger" id="rLogout"><div class="pl"><span class="pic">🚪</span>Выйти</div><span class="parr">›</span></div>
     </div>
     <div class="pmeta" style="text-align:center;margin-top:8px">Cognitive Core · память для AI-агентов</div>`;
  // Тема
  document.getElementById('rTheme').addEventListener('click',()=>{
    localStorage.setItem('chat-theme', themeOn()?'dark':'light'); applyTheme();
    document.getElementById('rTheme').classList.toggle('on', !themeOn());
  });
  // Установка
  const ri=document.getElementById('rInstall');
  if(ri) ri.addEventListener('click',async ()=>{
    if(deferredPrompt){ deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; return; }
    if(isIOS){ alert('На iPhone: нажми «Поделиться» внизу Safari → «На экран „Домой“». Иконка появится как «Память».'); return; }
    alert('Открой этот адрес в Chrome (Android) или Safari (iPhone), затем установи из меню браузера.');
  });
  // Уведомления. Три отдельных условия отказа, и каждое обязано быть видно:
  // браузер не умеет, сервер без ключей, пользователь запретил. Без этого
  // «не приходит» выглядит одинаково во всех трёх случаях.
  const rp=document.getElementById('rPush');
  if(rp) initPush(rp);
  // Аккаунт
  document.getElementById('rSwitch').addEventListener('click',async ()=>{
    if(!confirm('Выйти из текущего аккаунта и войти под другим?')) return;
    try{ await fetch('/auth/logout',{method:'POST',credentials:'include'}); }catch(e){}
    location.href='/ui/login?return=/chat';
  });
  document.getElementById('rLogout').addEventListener('click',async ()=>{
    if(!confirm('Выйти из аккаунта?')) return;
    try{ await fetch('/auth/logout',{method:'POST',credentials:'include'}); }catch(e){}
    location.href='/ui/login';
  });
  const rs=document.getElementById('rSupport');
  if(rs) rs.addEventListener('click',openSupport);
  // Правка имени профиля
  const re=document.getElementById('rEditName');
  if(re) re.addEventListener('click',async ()=>{
    const cur=(lastUser&&(lastUser.display_name||''))||'';
    const n=prompt('Как тебя показывать?', cur); if(n===null) return;
    const name=n.trim(); if(!name||name===cur) return;
    try{
      const r=await fetch('/user/me',{...J,method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:name})});
      if(!r.ok){ alert('Не удалось сохранить ('+r.status+')'); return; }
      if(lastUser) lastUser.display_name=name; buildProfile(lastUser);
    }catch(e){ alert('Ошибка: '+(e&&e.message||e)); }
  });
}

async function ensureSupportRoom(){
  if(supportRoomId) return supportRoomId;
  const sr=rooms.find(x=>(x.name||'').indexOf('🛟')===0 || x.name==='Техподдержка');
  if(sr){ supportRoomId=sr.id; return supportRoomId; }
  try{
    const r=await fetch('/user/rooms',{...J,method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:'🛟 Техподдержка'})});
    if(r.ok){ const d=await r.json(); supportRoomId=d.id; rooms.push({id:d.id,name:'🛟 Техподдержка',is_owner:true}); }
  }catch(e){}
  return supportRoomId;
}

async function openRoomSettings(id){
  openSheet('<h3>Настройки комнаты</h3><div class="ss" style="padding:16px 4px">Загрузка…</div>');
  let d; try{ const r=await fetch(`/user/rooms/${id}/detail`,J);
    if(!r.ok){ openSheet('<h3>Настройки</h3><div class="ss" style="padding:12px 4px">Недоступно ('+r.status+')</div><button class="sheet-btn" id="stClose">Закрыть</button>'); document.getElementById('stClose').onclick=closeSheet; return; }
    d=await r.json();
  }catch(e){ closeSheet(); return; }
  const parts=(d.participants||[]);
  const av=(nm)=>`<div class="rav" style="width:36px;height:36px;font-size:13px;background:linear-gradient(135deg,${colorFor(nm)})">${H(initials(nm))}</div>`;
  const partHtml = parts.length ? parts.map(p=>{ const nm=p.display_name||p.agent_id;
    return `<div class="srow">${av(nm)}<div class="sn"><div class="snm">${H(nm)}</div>
      <div class="ss">${p.auto_respond?'отвечает автоматически':'ручной режим'}</div></div>
      <div class="toggle ${p.auto_respond?'on':''}" data-ar="${H(p.agent_id)}"></div></div>`; }).join('')
    : '<div class="ss" style="padding:8px 4px">Пока нет агентов-участников</div>';
  openSheet(
    '<h3>'+H(d.name||'Комната')+'</h3>'+
    '<button class="sheet-btn" id="stRename">✏️ Переименовать</button>'+
    '<div style="margin:16px 0 4px;font-size:13px;color:var(--mut)">Участники</div>'+partHtml+
    '<button class="sheet-btn" id="stAddAgent">＋ Добавить агента</button>'+
    '<button class="sheet-btn danger" id="stDelete">Удалить комнату</button>'+
    '<button class="sheet-btn" id="stClose">Закрыть</button>');
  document.getElementById('stClose').onclick=closeSheet;
  sheetCard.querySelectorAll('.toggle[data-ar]').forEach(t=>t.addEventListener('click',async ()=>{
    const aid=t.getAttribute('data-ar'), on=!t.classList.contains('on'); t.classList.toggle('on',on);
    try{ const r=await fetch(`/user/rooms/${id}/participants/${encodeURIComponent(aid)}/auto-respond`,
      {...J,method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})});
      if(!r.ok) throw 0; }catch(e){ t.classList.toggle('on',!on); }
  }));
  document.getElementById('stRename').onclick=async ()=>{
    const n=prompt('Новое название', d.name||''); if(n===null) return; const name=n.trim(); if(!name||name===d.name) return;
    try{ const r=await fetch(`/user/rooms/${id}`,{...J,method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
      if(!r.ok){ alert('Не удалось ('+r.status+')'); return; }

      renderRoomList(); openRoomSettings(id);
    }catch(e){}
  };
  document.getElementById('stDelete').onclick=async ()=>{
    if(!confirm('Удалить комнату «'+(d.name||'')+'» со всеми сообщениями?')) return;
    try{ const r=await fetch(`/user/rooms/${id}`,{...J,method:'DELETE'});
      if(!r.ok){ alert('Не удалось ('+r.status+')'); return; }
      rooms=rooms.filter(x=>x.id!==id); closeSheet(); renderRoomList();
      if(roomId===id){ roomId=null; liveGen++; go('vRooms'); }

  }));
}

/* ─── Уведомления ─── */
function b64ToU8(b64){
  // VAPID-ключ приходит в url-safe base64 без выравнивания, а atob хочет
  // обычный с ним. Без этой правки подписка падает на InvalidCharacterError.
  const pad='='.repeat((4-b64.length%4)%4);
  const raw=atob((b64+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function currentSub(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  const reg=await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function initPush(el){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    el.classList.add('off'); el.title='Браузер не поддерживает уведомления'; return;
  }
  try{ el.classList.toggle('on', !!(await currentSub())); }catch(e){}
  el.addEventListener('click',async ()=>{
    try{
      const sub=await currentSub();
      if(sub){
        await fetch('/push/unsubscribe',{...J,method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(subPayload(sub))});
        await sub.unsubscribe(); el.classList.remove('on'); return;
      }
      const kr=await fetch('/push/vapid-public-key', J);
      if(kr.status===503){ alert('Уведомления не настроены на сервере: нет ключей VAPID.'); return; }
      if(!kr.ok){ alert('Не удалось получить ключ: '+kr.status); return; }
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){ alert('Уведомления запрещены в настройках браузера.'); return; }
      const reg=await navigator.serviceWorker.ready;
      const ns=await reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:b64ToU8((await kr.json()).key)});
      const r=await fetch('/push/subscribe',{...J,method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(subPayload(ns))});
      if(!r.ok){ alert('Сервер не принял подписку: '+r.status); return; }
      el.classList.add('on');
      await fetch('/push/test',{...J,method:'POST'});
    }catch(e){ alert('Не получилось: '+(e&&e.message||e)); }
  });
}
function subPayload(sub){
  const j=sub.toJSON();
  return {endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth,
          user_agent:(navigator.userAgent||'').slice(0,300)};
}

/* ─── Service worker ─── */
// Регистрируем после загрузки, а не в разборе страницы: установка воркера
// конкурирует с первыми запросами за соединения, и на телефоне это видно.
// Ошибку глотаем молча — приложение обязано работать и без воркера.
window.addEventListener('load',()=>{
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
});
