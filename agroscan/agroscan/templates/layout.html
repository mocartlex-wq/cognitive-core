<!doctype html><html lang="ru"><meta charset="utf-8">
<title>Раскладка схемы ЧЗУ</title>
<style>
 body{margin:0;font:14px/1.4 system-ui,Segoe UI,Arial;background:#f3f4f6;color:#111}
 header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d1d5db;padding:10px 16px;
        display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}
 h1{font-size:15px;margin:0 12px 0 0}
 button{font:inherit;padding:7px 14px;border:1px solid #9ca3af;border-radius:6px;background:#fff;cursor:pointer}
 button.main{background:#166534;color:#fff;border-color:#166534}
 .hint{color:#4b5563;font-size:13px}
 #wrap{margin:16px auto;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.18);background:#fff}
 #sheet{display:block;width:100%}
 .box{position:absolute;border:2px solid #dc2626;background:rgba(220,38,38,.10);cursor:grab;
      border-radius:3px;font-size:11px;color:#7f1d1d;user-select:none}
 .box b{position:absolute;left:0;top:-16px;white-space:nowrap;background:#fff;padding:0 4px;
        border:1px solid #dc2626;border-radius:3px}
 .box.drag{cursor:grabbing;border-color:#166534;background:rgba(22,101,52,.12)}
 code{background:#e5e7eb;padding:1px 5px;border-radius:4px}
</style>
<header>
  <h1>Раскладка схемы <span id="kn"></span></h1>
  <button class="main" id="save">Скачать layout.json</button>
  <button id="reset">Вернуть как было</button>
  <span class="hint">Тяните рамки мышью. Файл положите в <code>data/&lt;КН&gt;/layout.json</code> —
  при следующей сборке подписи встанут туда, куда вы их поставили.</span>
</header>
<div id="wrap"><img id="sheet" alt="схема"></div>
<script>
const IMG = /*IMG*/"", ITEMS = /*ITEMS*/[], SHEET = /*SHEET*/[297,210], KN = /*KN*/"";
document.getElementById('kn').textContent = KN;
const img = document.getElementById('sheet'), wrap = document.getElementById('wrap');
img.src = IMG;
const start = JSON.parse(JSON.stringify(ITEMS));
let px = 1;                                  // пикселей на миллиметр в текущем показе

function place(el, it){
  const w = it.w * px, h = it.h * px;
  const left = it.center ? it.x * px - w / 2 : it.x * px;
  const top  = it.center ? it.y * px - h / 2 : it.y * px;
  el.style.left = left + 'px'; el.style.top = top + 'px';
  el.style.width = w + 'px';   el.style.height = h + 'px';
}
function layoutAll(){
  px = img.clientWidth / SHEET[0];
  wrap.style.width = img.clientWidth + 'px';
  document.querySelectorAll('.box').forEach(el => place(el, ITEMS.find(i => i.key === el.dataset.key)));
}
img.addEventListener('load', () => {
  wrap.style.maxWidth = Math.min(1500, window.innerWidth - 40) + 'px';
  ITEMS.forEach(it => {
    const el = document.createElement('div');
    el.className = 'box'; el.dataset.key = it.key;
    el.innerHTML = '<b>' + it.title + '</b>';
    wrap.appendChild(el);
    let sx = 0, sy = 0, ox = 0, oy = 0;
    el.addEventListener('pointerdown', e => {
      el.setPointerCapture(e.pointerId); el.classList.add('drag');
      sx = e.clientX; sy = e.clientY; ox = it.x; oy = it.y;
    });
    el.addEventListener('pointermove', e => {
      if (!el.classList.contains('drag')) return;
      it.x = Math.max(0, Math.min(SHEET[0], ox + (e.clientX - sx) / px));
      it.y = Math.max(0, Math.min(SHEET[1], oy + (e.clientY - sy) / px));
      place(el, it);
    });
    el.addEventListener('pointerup', e => { el.classList.remove('drag'); });
  });
  layoutAll();
});
window.addEventListener('resize', layoutAll);

document.getElementById('reset').onclick = () => {
  start.forEach(s0 => { const it = ITEMS.find(i => i.key === s0.key); it.x = s0.x; it.y = s0.y; });
  layoutAll();
};
document.getElementById('save').onclick = () => {
  const out = {кн: KN, единицы: 'мм от левого верхнего угла листа', позиции: {}};
  ITEMS.forEach(i => out.позиции[i.key] = [Math.round(i.x * 100) / 100, Math.round(i.y * 100) / 100]);
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'layout.json'; a.click();
};
</script>
</html>
