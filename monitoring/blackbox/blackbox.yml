# External availability prober. ASCII only on purpose: cyrillic in this tree
# has broken the YAML parser before (see prometheus.yml header).
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_status_codes: []
  http_2xx_or_redirect:
    prober: http
    timeout: 10s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 301, 302, 303, 307, 308]
